version: '3.8'  # Versión más reciente para soporte mejorado

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: keycloak  # Nombre explícito para el contenedor
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres_keycloak:5432/keycloak_db?currentSchema=public  # Formato JDBC correcto
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${DB_PASSWORD:-123456}  # Usa variable de entorno para seguridad
      KC_HOSTNAME: localhost  # Evita warnings
      KC_HTTP_ENABLED: "true"  # Habilita HTTP (solo para desarrollo)
      KC_BOOTSTRAP_ADMIN_USER: admin  # Parámetro actualizado (Keycloak >= 17)
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      KEYCLOAK_ADMIN: admin  # Alternativa moderna
      KEYCLOAK_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      KC_IMPORT: /opt/keycloak/data/import/master.json,/opt/keycloak/data/import/realm-export.json  # Importación explícita
    ports:
      - "8080:8080"  # Puerto HTTP
      - "8443:8443"  # Puerto HTTPS (recomendado para producción)
    depends_on:
      postgres_keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]  # Puerto corregido (9000 es para métricas)
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ./keycloak-realm:/opt/keycloak/data/import  # Monta los archivos JSON
    networks:
      - app-network

  postgres_keycloak:
    image: postgres:17.3
    container_name: postgres_keycloak  # Nombre explícito
    restart: unless-stopped  # Mejor que "always"
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}  # Variable de entorno
      POSTGRES_DB: keycloak_db
      POSTGRES_HOST_AUTH_METHOD: md5  # Autenticación segura
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data  # Persistencia de datos
    ports:
      - "5432:5432"  # Solo necesario si accedes externamente
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak_db"]  # Verifica DB específica
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  postgres_keycloak_data:  # Volumen para persistencia
    driver: local
networks:
  app-network:
    driver: bridge