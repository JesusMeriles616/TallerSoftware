version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: abc123
      MYSQL_DATABASE: Dashboard_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - app-network

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard_app
    ports:
      - "7004:7004"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/Dashboard_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=abc123
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
