version: "3.8"

services:
  mysql:
    image: mysql:latest
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: abc123
      MYSQL_DATABASE: Dashboard_db
    ports:
      - "3400:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - app-network

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka_server
    ports:
      - "8761:8761"
    environment:
      - EUREKA_SERVER_PASSWORD=admin123
    restart: unless-stopped
    networks:
      - app-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard_app
    ports:
      - "7004:7004"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/Dashboard_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=abc123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://admin:admin123@eureka-server:8761/eureka/
    depends_on:
      - mysql
      - eureka-server
    restart: unless-stopped
    networks:
      - app-network

