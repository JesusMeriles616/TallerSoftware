version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: abc123
      MYSQL_DATABASE: Dashboard_db
    ports:
      - "3333:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - app-network

  eureka:
    image: springcloud/eureka
    container_name: eureka_server
    ports:
      - "8761:8761"
    networks:
      - app-network
    restart: unless-stopped

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: dashboard_app
    ports:
      - "7004:7004"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/Dashboard_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=abc123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
    depends_on:
      - mysql
      - eureka
    restart: unless-stopped
    networks:
      - app-network

  game:
    build:
      context: ../game
      dockerfile: Dockerfile
    container_name: game_app
    ports:
      - "7001:7001"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
    depends_on:
      - eureka
    restart: unless-stopped
    networks:
      - app-network

  child:
    build:
      context: ../child
      dockerfile: Dockerfile
    container_name: child_app
    ports:
      - "7002:7002"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
    depends_on:
      - eureka
    restart: unless-stopped
    networks:
      - app-network

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway_app
    ports:
      - "7000:7000"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
    depends_on:
      - eureka
      - dashboard
      - game
      - child
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data: 